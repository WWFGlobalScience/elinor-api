name: Mirror database backups to non-AWS (MS Azure) location
on:
  schedule:
    - cron: "0 0 * * *"  # Runs daily
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dbbackup-mirror
  cancel-in-progress: false
jobs:
  rclone:
    runs-on: ubuntu-latest
    steps:
      - name: rclone copy
        uses: data-mermaid/backup/rclone@v2
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        with:
          args: copy --verbose dbbackups-s3:elinor-db-backups dbbackups-azure:backup --log-file=/github/runner_temp/copy-stats.log --stats-one-line
      - name: rclone delete
        uses: data-mermaid/backup/rclone@v2
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        with:
          args: delete --verbose --min-age 61d dbbackups-azure:backup --log-file=/github/runner_temp/delete-stats.log --stats-one-line
      - name: checkout
        uses: actions/checkout@v4
      - name: record mirror run
        run: |
          set -o pipefail
          mkdir -p .github/dbbackup-mirror
          COPY_STATS=$(grep "Transferred:" "$RUNNER_TEMP/copy-stats.log" | tail -n1 || echo "no stats captured")
          DELETE_STATS=$(grep "Transferred:" "$RUNNER_TEMP/delete-stats.log" | tail -n1 || echo "no stats captured")
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) copy: ${COPY_STATS} | delete: ${DELETE_STATS}" >> .github/dbbackup-mirror/log.md
          rm -f "$RUNNER_TEMP/copy-stats.log" "$RUNNER_TEMP/delete-stats.log"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/dbbackup-mirror/log.md
          git commit -m "chore: record dbbackup mirror run [skip ci]"
          git push
